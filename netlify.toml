[build]
  publish = "out"
  command = "npm run build"

[[plugins]]
  package = "@netlify/plugin-image-cdn"

[build.environment]
  NODE_VERSION = "18"

[[headers]]
  for = "/images/optimized/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
