<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="output.css">
    <link rel="shortcut icon" href="assets/img/logo.png" type="image/x-icon">
    <title>Victoria Provisionato Zitta · Fashion Stylist</title>

    <!-- SEO Meta Tags -->
    <meta name="description"
        content="Portfolio de Victoria Provisionato Zitta, Fashion Stylist. Estilismo, editoriales y trabajos destacados.">
    <meta name="robots" content="index,follow">
    <link rel="canonical" href="https://porfoliovictoriazitta.netlify.app/">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Victoria Provisionato Zitta · Fashion Stylist">
    <meta property="og:description"
        content="Portfolio de estilismo de Victoria Provisionato Zitta: editoriales y producciones.">
    <meta property="og:url" content="https://porfoliovictoriazitta.netlify.app/">
    <meta property="og:image" content="https://porfoliovictoriazitta.netlify.app/assets/img/preview.png">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Victoria Provisionato Zitta · Fashion Stylist">
    <meta name="twitter:description" content="Portfolio de estilismo: editoriales y producciones.">
    <meta name="twitter:image" content="https://porfoliovictoriazitta.netlify.app/assets/img/preview.png">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&display=swap"
        rel="stylesheet">
</head>

<body class="bg-white text-black overflow-x-hidden">

    <!-- Navbar Responsive -->
    <nav class="fixed top-0 left-0 w-full z-50 bg-black shadow-lg">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">

            <!-- Botón Hamburguesa (Mobile/Tablet) -->
            <button id="menu-toggle" class="lg:hidden text-white focus:outline-none z-50">
                <svg id="hamburger-icon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16">
                    </path>
                </svg>
                <svg id="close-icon" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                    </path>
                </svg>
            </button>

            <!-- Logo Centrado (Mobile/Tablet) / Derecha (Desktop) -->
            <div
                class="lg:order-2 absolute left-1/2 transform -translate-x-1/2 lg:relative lg:left-0 lg:transform-none">
                <a href="home.html"
                    class="text-white text-2xl md:text-3xl font-playfair font-bold tracking-wider uppercase transition-colors duration-300 hover:text-[#ff1493] whitespace-nowrap">Victoria
                    Zitta</a>
            </div>

            <!-- Navegación Desktop -->
            <ul class="hidden lg:flex items-center gap-6 md:gap-10">
                <li>
                    <a href="estilismo.html"
                        class="text-white text-sm md:text-base font-bold uppercase transition-colors duration-300 hover:text-[#ff1493]">ESTILISMO</a>
                </li>
                <li>
                    <a href="editorial.html"
                        class="text-white text-sm md:text-base font-bold uppercase transition-colors duration-300 hover:text-[#ff1493]">EDITORIAL</a>
                </li>
                <li>
                    <a href="ecommerce.html"
                        class="text-white text-sm md:text-base font-bold uppercase transition-colors duration-300 hover:text-[#ff1493]">ECOMMERCE</a>
                </li>
            </ul>

        </div>
    </nav>

    <!-- Menú Mobile/Tablet Fullscreen -->
    <div id="mobile-menu"
        class="fixed inset-0 bg-black z-40 flex items-center justify-center transform translate-x-full transition-transform duration-300 ease-in-out">
        <ul class="flex flex-col items-center gap-8">
            <li>
                <a href="estilismo.html"
                    class="menu-link text-white text-3xl font-bold uppercase transition-colors duration-300 hover:text-[#ff1493]">ESTILISMO</a>
            </li>
            <li>
                <a href="editorial.html"
                    class="menu-link text-white text-3xl font-bold uppercase transition-colors duration-300 hover:text-[#ff1493]">EDITORIAL</a>
            </li>
            <li>
                <a href="ecommerce.html"
                    class="menu-link text-white text-3xl font-bold uppercase transition-colors duration-300 hover:text-[#ff1493]">ECOMMERCE</a>
            </li>
        </ul>
    </div>

    <!-- Imagen Hero - 100vh Responsive -->
    <section class="h-screen w-full bg-cover bg-center bg-no-repeat relative"
        style="background-image: url('assets/img/banner.jpg');">
        <!-- Overlay oscuro sutil para mejorar contraste -->
        <div class="absolute inset-0 bg-black/60"></div>

        <!-- Texto centrado alineado a la derecha (responsive) -->
        <div class="absolute inset-0 flex items-center justify-center md:justify-end px-6 md:pr-24">
            <h1
                class="text-white/70 text-2xl md:text-2xl lg:text-3xl font-playfair font-bold uppercase tracking-wider transition-colors duration-300 hover:text-white cursor-default z-10 text-center md:text-right">
                Fashion Stylist
            </h1>
        </div>
    </section>

    <!-- Footer Responsive -->
    <footer class="fixed bottom-0 left-0 w-full bg-black py-4">
        <div class="max-w-7xl mx-auto px-6">
            <!-- Lista horizontal en desktop, vertical en mobile -->
            <ul class="flex flex-col md:flex-row items-center justify-center gap-4 md:gap-10">
                <li>
                    <a href="https://instagram.com/victoriaa.p.zitta" target="_blank"
                        class="text-white text-sm md:text-base font-bold uppercase transition-colors duration-300 hover:text-[#ff1493]">INSTAGRAM</a>
                </li>
                <li>
                    <a href="contact.html"
                        class="text-white text-sm md:text-base font-bold uppercase transition-colors duration-300 hover:text-[#ff1493]">CONTACTO</a>
                </li>
                <li>
                    <a href="mailto:victoriaprovzitta@gmail.com"
                        class="text-white text-sm md:text-base font-bold uppercase transition-colors duration-300 hover:text-[#ff1493]">MAIL</a>
                </li>
            </ul>
        </div>
    </footer>

    <!-- JavaScript para menú hamburguesa -->
    <script>
        const menuToggle = document.getElementById('menu-toggle');
        const mobileMenu = document.getElementById('mobile-menu');
        const hamburgerIcon = document.getElementById('hamburger-icon');
        const closeIcon = document.getElementById('close-icon');
        const menuLinks = document.querySelectorAll('.menu-link');

        // Toggle menú
        menuToggle.addEventListener('click', () => {
            const isOpen = mobileMenu.classList.contains('translate-x-0');

            if (isOpen) {
                // Cerrar menú
                mobileMenu.classList.remove('translate-x-0');
                mobileMenu.classList.add('translate-x-full');
                hamburgerIcon.classList.remove('hidden');
                closeIcon.classList.add('hidden');
                document.body.style.overflow = '';
            } else {
                // Abrir menú
                mobileMenu.classList.remove('translate-x-full');
                mobileMenu.classList.add('translate-x-0');
                hamburgerIcon.classList.add('hidden');
                closeIcon.classList.remove('hidden');
                document.body.style.overflow = 'hidden';
            }
        });

        // Cerrar menú al hacer click en un link
        menuLinks.forEach(link => {
            link.addEventListener('click', () => {
                mobileMenu.classList.remove('translate-x-0');
                mobileMenu.classList.add('translate-x-full');
                hamburgerIcon.classList.remove('hidden');
                closeIcon.classList.add('hidden');
                document.body.style.overflow = '';
            });
        });
    </script>

</body>

</html>
